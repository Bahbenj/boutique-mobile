# Nginx (alternative à Caddy). HTTPS : certbot l'ajoute et le renouvelle automatiquement :
#   sudo cp deploy/nginx-mobile-empire.conf /etc/nginx/sites-available/mobile-empire
#   sudo ln -s /etc/nginx/sites-available/mobile-empire /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d www.mobile-empire.ml -d mobile-empire.ml --redirect
# Remplacez les domaines avant de copier.

# Adresse sans « www » : redirigée vers l'adresse principale
server {
    listen 80;
    listen [::]:80;
    server_name mobile-empire.ml;
    return 301 https://www.mobile-empire.ml$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.mobile-empire.ml;

    # Formulaires du site et de l'admin (les photos vont directement chez Supabase)
    client_max_body_size 5m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Adresse réelle du visiteur, ÉCRASÉE (jamais ajoutée à une valeur envoyée par le
        # navigateur) : utilisée par les limites anti-robots (lib/request-key.ts)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Pages envoyées en continu (rendu partiel) : pas de mise en tampon
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
